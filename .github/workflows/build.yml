name: Build

on:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Inga API-nycklar i repot
        run: |
          if git grep -nIE '(TRAFIKVERKET_API_KEY\s*[=:]\s*|authenticationkey=)["'"'"']?[0-9a-fA-F]{32}' -- . ':!.github/workflows/build.yml'; then
            echo "::error::En API-nyckel ser ut att vara incheckad. Nyckeln hör hemma i .env."; exit 1
          fi

      - name: VERSION och CHANGELOG.md hör ihop
        run: .github/release-notes.sh "$(tr -d '[:space:]' < VERSION)"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: tagkoll:ci
          cache-from: type=gha

      - name: Starta containern härdad (som i docker-compose.yml) och kontrollera hälsan
        run: |
          docker run -d --name tagkoll -p 8843:8843 --read-only --tmpfs /tmp --cap-drop ALL \
            --security-opt no-new-privileges:true tagkoll:ci
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:8843/api/health; then break; fi
            if [ "$i" = 20 ]; then docker logs tagkoll; exit 1; fi
            sleep 1
          done

      - name: Säkerhetsrubriker finns och Server-rubriken är borta
        run: |
          headers="$(curl -fsSI http://localhost:8843/)"
          echo "$headers"
          for h in content-security-policy x-frame-options x-content-type-options referrer-policy; do
            grep -qi "^$h:" <<< "$headers" || { echo "::error::Rubriken $h saknas"; exit 1; }
          done
          if grep -qi "^server:" <<< "$headers"; then echo "::error::Server-rubriken skickas"; exit 1; fi

      - name: Inga kända sårbarheter i Python-paketen
        run: |
          pipx run pip-audit --requirement requirements.txt --strict --progress-spinner off
