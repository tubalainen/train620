name: Security

# Daglig kontroll av kända säkerhetshål:
#  1. Trivy granskar den släppta imagen (operativsystem och alla installerade paket).
#  2. pip-audit granskar Python-beroendena i requirements.txt mot PyPI:s sårbarhetsdatabas.
# Körs varje natt, efter varje ändring på main (t.ex. en release) och när den startas för hand.
# Hittas allvarliga hål misslyckas jobbet och ett ärende öppnas; ärendet stängs när allt är rent.
on:
  schedule:
    - cron: "17 4 * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: read
  issues: write

concurrency:
  group: security
  cancel-in-progress: false

env:
  RELEASED_IMAGE: ghcr.io/${{ github.repository }}:latest
  ISSUE_TITLE: Säkerhetshål i Tågkoll

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Den släppta imagen är den som faktiskt körs. Finns ingen release ännu byggs källkoden.
      - name: Välj image
        id: image
        run: |
          if docker pull "$RELEASED_IMAGE"; then
            echo "ref=$RELEASED_IMAGE" >> "$GITHUB_OUTPUT"
          else
            docker build -t tagkoll:scan .
            echo "ref=tagkoll:scan" >> "$GITHUB_OUTPUT"
          fi

      - name: Sök säkerhetshål i imagen med Trivy
        id: trivy
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.ref }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
          output: trivy-report.txt

      - name: Sök säkerhetshål i Python-beroendena med pip-audit
        id: pipaudit
        continue-on-error: true
        run: |
          set -o pipefail
          pipx run pip-audit --requirement requirements.txt --strict --progress-spinner off --desc on 2>&1 | tee pip-audit-report.txt

      - name: Visa rapport
        if: always()
        run: |
          {
            echo "## Trivy (image)"; echo '```'; cat trivy-report.txt 2>/dev/null || echo "ingen rapport"; echo '```'
            echo "## pip-audit (requirements.txt)"; echo '```'; cat pip-audit-report.txt 2>/dev/null || echo "ingen rapport"; echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Öppna eller uppdatera ärende
        if: steps.trivy.outcome == 'failure' || steps.pipaudit.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ steps.image.outputs.ref }}
          TRIVY: ${{ steps.trivy.outcome }}
          PIPAUDIT: ${{ steps.pipaudit.outcome }}
        run: |
          {
            echo "Den dagliga säkerhetskontrollen hittade kända säkerhetshål."
            echo
            echo "- Trivy (image \`$IMAGE\`, HIGH/CRITICAL med rättning): **$TRIVY**"
            echo "- pip-audit (requirements.txt): **$PIPAUDIT**"
            echo
            echo "Körning: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo
            echo "Rättning: höj versionen i \`requirements.txt\` för sårbara Python-paket och gör en ny release."
            echo "En ny release bygger också om imagen med uppdaterad basimage."
            echo
            echo "### Trivy"; echo '```'; head -c 30000 trivy-report.txt 2>/dev/null; echo '```'
            echo "### pip-audit"; echo '```'; head -c 20000 pip-audit-report.txt 2>/dev/null; echo '```'
          } > issue.md
          number="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$ISSUE_TITLE\"" --json number --jq '.[0].number // empty')"
          if [[ -n "$number" ]]; then
            gh issue edit "$number" --repo "$GITHUB_REPOSITORY" --body-file issue.md
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$ISSUE_TITLE" --body-file issue.md
          fi

      - name: Stäng ärendet när allt är rent
        if: steps.trivy.outcome == 'success' && steps.pipaudit.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          number="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$ISSUE_TITLE\"" --json number --jq '.[0].number // empty')"
          if [[ -n "$number" ]]; then
            gh issue close "$number" --repo "$GITHUB_REPOSITORY" --comment "Dagens kontroll hittade inga kända säkerhetshål."
          fi

      - name: Misslyckas om säkerhetshål hittades
        if: steps.trivy.outcome == 'failure' || steps.pipaudit.outcome == 'failure'
        run: exit 1
